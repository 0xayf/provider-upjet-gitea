---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: tokens.gitea.gitea.m.crossplane.io
spec:
  group: gitea.gitea.m.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - gitea
    kind: Token
    listKind: TokenList
    plural: tokens
    singular: token
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Token manages a Gitea access token. The hand-written controller talks
          to /users/{username}/tokens directly via HTTP Basic auth (the only
          auth mode Gitea accepts on this endpoint family), captures the token
          value at creation time, and re-mints on scope drift so PAT scope
          rotation becomes a plain spec edit.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TokenSpec defines the desired state of Token.
            properties:
              forProvider:
                description: |-
                  TokenParameters defines the desired state of a Gitea access token. The
                  token is minted under the user identified by the credentials in the
                  referenced ProviderConfig (Gitea's /users/{username}/tokens endpoint
                  accepts only HTTP Basic auth as that user).
                properties:
                  name:
                    description: |-
                      Name is the token's display name. Immutable on the Gitea side after
                      creation; changing it requires destroy + recreate, which the
                      controller handles transparently.
                    type: string
                  scopes:
                    description: |-
                      Scopes is the set of OAuth scopes the token authorises. Valid
                      scopes are documented in Gitea's API reference. Changing this set
                      triggers a delete-and-recreate (Gitea has no PATCH for tokens);
                      the controller updates the connection secret with the new value,
                      so downstream consumers see the rotation automatically.
                    items:
                      type: string
                    type: array
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
            x-kubernetes-validations:
            - message: spec.forProvider.name is a required parameter
              rule: '!(''*'' in self.managementPolicies || ''Create'' in self.managementPolicies
                || ''Update'' in self.managementPolicies) || has(self.forProvider.name)'
            - message: spec.forProvider.scopes must contain at least one scope
              rule: '!(''*'' in self.managementPolicies || ''Create'' in self.managementPolicies
                || ''Update'' in self.managementPolicies) || (has(self.forProvider.scopes)
                && size(self.forProvider.scopes) > 0)'
          status:
            description: TokenStatus defines the observed state of Token.
            properties:
              atProvider:
                description: TokenObservation reflects observed state from Gitea.
                properties:
                  id:
                    description: |-
                      ID is Gitea's numeric token identifier. Stored as a string here for
                      consistency with the upjet-shape MRs already on cluster.
                    type: string
                  lastEight:
                    description: |-
                      LastEight is the last eight characters of the token value as
                      returned at creation time. Useful for identifying which token a
                      claim corresponds to in the Gitea UI.
                    type: string
                  rotatedAt:
                    description: |-
                      RotatedAt is the timestamp at which the controller last performed
                      a delete-and-recreate to reconcile a scope-set drift. Tokens
                      cannot be patched in place — Gitea has no PATCH endpoint — so any
                      scope change requires re-minting the token value.
                    format: date-time
                    type: string
                  scopes:
                    description: |-
                      Scopes is the set Gitea reports for this token. The controller
                      compares this against spec.forProvider.scopes to detect scope drift.
                    items:
                      type: string
                    type: array
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
