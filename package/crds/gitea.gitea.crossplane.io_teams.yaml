---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: teams.gitea.gitea.crossplane.io
spec:
  group: gitea.gitea.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - gitea
    kind: Team
    listKind: TeamList
    plural: teams
    singular: team
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .metadata.annotations.crossplane\.io/external-name
      name: EXTERNAL-NAME
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Team manages a Gitea organisation team with explicit per-unit permissions
          (units_map). Replaces the upjet-generated Team resource so the controller
          can drive Gitea's per-unit permission model directly, including
          repo.packages / repo.actions which the upstream Terraform provider's
          `units` enum does not honour.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TeamSpec defines the desired state of Team.
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what will happen to the underlying external
                  when this managed resource is deleted - either "Delete" or "Orphan" the
                  external resource.
                  This field is planned to be deprecated in favor of the ManagementPolicies
                  field in a future release. Currently, both could be set independently and
                  non-default values would be honored if the feature flag is enabled.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                enum:
                - Orphan
                - Delete
                type: string
              forProvider:
                description: |-
                  TeamParameters is the desired state of a Gitea team. unitsMap is required —
                  the legacy `permission` + `units` shape is intentionally not exposed here.
                properties:
                  canCreateOrgRepo:
                    description: CanCreateOrgRepo lets team members create new repos
                      under the org.
                    type: boolean
                  description:
                    description: Description is a free-form team description shown
                      in the Gitea UI.
                    type: string
                  includeAllRepositories:
                    description: |-
                      IncludeAllRepositories grants the team access to every current and
                      future repository in the organisation. Mutually exclusive with
                      Repositories — when true, Repositories is ignored.
                    type: boolean
                  name:
                    description: |-
                      Name is the team's name within the organisation. Immutable on the
                      Gitea side after creation; renaming requires delete + recreate.
                    type: string
                  organisation:
                    description: Organisation is the org that owns the team.
                    type: string
                  repositories:
                    description: |-
                      Repositories is the explicit list of repos the team's permissions
                      apply to. Empty when IncludeAllRepositories is true.
                    items:
                      type: string
                    type: array
                  unitsMap:
                    additionalProperties:
                      type: string
                    description: |-
                      UnitsMap is the per-unit permission map. Keys must be valid Gitea
                      team unit names; values must be one of `none`, `read`, `write`,
                      `admin`. A unit absent from the map is `none` for that team.

                      The full set of recognised keys is:
                        repo.code, repo.issues, repo.ext_issues,
                        repo.wiki, repo.ext_wiki,
                        repo.pulls, repo.releases, repo.projects,
                        repo.packages, repo.actions
                    type: object
                required:
                - unitsMap
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  This field is planned to replace the DeletionPolicy field in a future
                  release. Currently, both could be set independently and non-default
                  values would be honored if the feature flag is enabled. If both are
                  custom, the DeletionPolicy field will be ignored.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  name:
                    description: Name of the referenced object.
                    type: string
                  policy:
                    description: Policies for referencing.
                    properties:
                      resolution:
                        default: Required
                        description: |-
                          Resolution specifies whether resolution of this reference is required.
                          The default is 'Required', which means the reconcile will fail if the
                          reference cannot be resolved. 'Optional' means this reference will be
                          a no-op if it cannot be resolved.
                        enum:
                        - Required
                        - Optional
                        type: string
                      resolve:
                        description: |-
                          Resolve specifies when this reference should be resolved. The default
                          is 'IfNotPresent', which will attempt to resolve the reference only when
                          the corresponding field is not present. Use 'Always' to resolve the
                          reference on every reconcile.
                        enum:
                        - Always
                        - IfNotPresent
                        type: string
                    type: object
                required:
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                  namespace:
                    description: Namespace of the secret.
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - forProvider
            type: object
            x-kubernetes-validations:
            - message: spec.forProvider.name is a required parameter
              rule: '!(''*'' in self.managementPolicies || ''Create'' in self.managementPolicies
                || ''Update'' in self.managementPolicies) || has(self.forProvider.name)'
            - message: spec.forProvider.organisation is a required parameter
              rule: '!(''*'' in self.managementPolicies || ''Create'' in self.managementPolicies
                || ''Update'' in self.managementPolicies) || has(self.forProvider.organisation)'
            - message: spec.forProvider.unitsMap must have at least one entry
              rule: '!(''*'' in self.managementPolicies || ''Create'' in self.managementPolicies
                || ''Update'' in self.managementPolicies) || (has(self.forProvider.unitsMap)
                && size(self.forProvider.unitsMap) > 0)'
          status:
            description: TeamStatus defines the observed state of Team.
            properties:
              atProvider:
                description: TeamObservation reflects observed Gitea state.
                properties:
                  id:
                    description: |-
                      ID is Gitea's team identifier (numeric in Gitea's API but stored as
                      a decimal string here to match Terraform-state convention — every
                      upjet-generated MR in this provider stores numeric IDs as strings,
                      and existing Team MRs in clusters that ran the upjet shape still
                      hold the string form). The hand-written controller parses on read
                      and formats on write.
                    type: string
                  unitsMap:
                    additionalProperties:
                      type: string
                    description: |-
                      UnitsMap is the per-unit permission level Gitea reports. This is
                      the canonical representation; we deliberately don't surface
                      Gitea's derived `permission` (always reported as `none` when the
                      team uses per-unit permissions) or its `units` list (which the
                      upstream Terraform provider serialised as a single string and
                      can't be cleanly mapped to []string in our hand-written shape).
                    type: object
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
